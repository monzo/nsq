[req]
distinguished_name = req_distinguished_name
# Set explicitly rather than inherited from the ambient OpenSSL defaults: the
# previous fixtures picked up a 512-bit SHA-1 CA, which Go >= 1.24 rejects
# (crypto/rsa enforces a 1024-bit minimum, and the x509sha1 GODEBUG escape
# hatch was removed in the same release).
default_bits = 2048
default_md = sha256

[req_distinguished_name]

[ca]
basicConstraints = critical, CA:true
subjectKeyIdentifier = hash
keyUsage = critical, cRLSign, keyCertSign

[client]
basicConstraints = critical, CA:FALSE
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = clientAuth

[server]
basicConstraints = critical, CA:FALSE
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth
subjectAltName = IP:127.0.0.1

# cert.pem/key.pem: a self-signed pair deliberately NOT issued by the CA above.
# Tests use it two ways: as a server cert where the client sets
# InsecureSkipVerify, and as a client cert that must FAIL verification against
# ca.pem. Signing it with the CA would silently invert those assertions.
[standalone]
basicConstraints = critical, CA:FALSE
subjectKeyIdentifier = hash
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth, clientAuth
subjectAltName = IP:127.0.0.1
